apiVersion: v1
kind: Service
metadata:
  name: test1
  namespace: kubeai
spec:
  selector:
    model: exaone3-5-ollama
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test1
  namespace: kubeai
  annotations:
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /test1
            pathType: Prefix
            backend:
              service:
                name: test1
                port:
                  number: 8000
