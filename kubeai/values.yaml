# Default values for kubeai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
crds:
  enabled: true

secrets:
  alibaba:
    create: true
    accessKeyID: ""
    accessKeySecret: ""
    # The name of the secret to use.
    # If not set, and create is true, the name is generated using the fullname template.
    # The secret values are pulled from the keys, "accessKeyID" and "accessKeySecret".
    name: ""
  aws:
    create: true
    accessKeyID: ""
    secretAccessKey: ""
    # The name of the secret to use.
    # If not set, and create is true, the name is generated using the fullname template.
    # The secret values are pulled from the keys, "accessKeyID" and "secretAccessKey".
    name: ""
  gcp:
    create: true
    jsonKeyfile: ""
    # The name of the secret to use.
    # If not set, and create is true, the name is generated using the fullname template.
    # The secret value is pulled from the key, "jsonKeyfile".
    name: ""
  huggingface:
    create: true
    token: ""
    # The name of the secret to use.
    # If not set, and create is true, the name is generated using the fullname template.
    # The token value is pulled from the key, "token".
    name: ""

modelServers:
  VLLM:
    images:
      # The key is the image name (referenced from resourceProfiles) and the value is the image.
      # The "default" image should always be specified.
      # "default" is used when no imageName is specified or if a specific image is not found.
      default: "vllm/vllm-openai:v0.8.3"
      nvidia-gpu: "vllm/vllm-openai:v0.8.3"
      # Apple Silicon MacBook 환경에서는 Kubernetes pod에 GPU(Metal/MPS)를 직접 할당하기 어렵기 때문에
      # CPU 이미지를 기본 호환 경로로 사용한다.
      cpu: "vllm/vllm-openai-cpu:latest-arm64"
      google-tpu: "substratusai/vllm:v0.6.4.post1-tpu"
      # Source: https://github.com/substratusai/vllm-docker/blob/main/Dockerfile.cuda-arm
      gh200: "substratusai/vllm-gh200:v0.8.3"
      # upstream vLLM seems to have broken ROCm support, so we are using a fork from AMD.
      # Source: https://hub.docker.com/r/rocm/vllm-dev
      # Source: https://github.com/ROCm/vllm
      amd-gpu: "muhammadn/vllm-rocm:gfx1201"  # gfx1201 패치 적용된 커뮤니티 이미지
  OLlama:
    images:
      default: "ollama/ollama:latest"
      cpu: "ollama/ollama:latest"
      amd-gpu: "ollama/ollama:rocm"
  FasterWhisper:
    images:
      default: "fedirz/faster-whisper-server:latest-cpu"
      nvidia-gpu: "fedirz/faster-whisper-server:latest-cuda"
  Infinity:
    images:
      default: "michaelf34/infinity:latest"

modelLoading:
  image: "cozy/kubeai-model-loader:lgcns"

modelServerPods:
  # Security Context for the model pods
  # Needed for OpenShift
  securityContext:
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # JSONPatch to apply to the model server pods
  # 멀티노드 환경을 위해 PVC 기반 캐시를 마운트하여 모델 재다운로드를 방지
  jsonPatches:
  - op: add
    path: /spec/volumes/-
    value:
      name: hf-cache
      persistentVolumeClaim:
        claimName: kubeai-hf-cache
  - op: add
    path: /spec/containers/0/volumeMounts/-
    value:
      name: hf-cache
      mountPath: /root/.cache/huggingface
  - op: add
    path: /spec/volumes/-
    value:
      name: ollama-cache
      persistentVolumeClaim:
        claimName: kubeai-ollama-cache
  - op: add
    path: /spec/containers/0/volumeMounts/-
    value:
      name: ollama-cache
      mountPath: /root/.ollama
  - op: add
    path: /spec/volumes/-
    value:
      name: custom-ca-cert
      configMap:
        name: lgcns-custom-ca
  - op: add
    path: /spec/volumes/-
    value:
      name: custom-ca-work
      emptyDir: {}
  - op: add
    path: /spec/initContainers
    value:
      - name: prepare-custom-ca-bundle
        image: "ollama/ollama:latest"
        command:
          - sh
          - -c
          - |
            cp /etc/ssl/certs/ca-certificates.crt /work/ca-certificates.crt
            cat /custom-ca/ca.crt >> /work/ca-certificates.crt
        volumeMounts:
          - name: custom-ca-cert
            mountPath: /custom-ca
            readOnly: true
          - name: custom-ca-work
            mountPath: /work
  - op: add
    path: /spec/containers/0/volumeMounts/-
    value:
      name: custom-ca-work
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: ca-certificates.crt
      readOnly: true

