modelServerPersistentCache:
  enabled: true
  # 현재 Minikube 클러스터의 기본 StorageClass는 standard 이므로 명시적으로 지정한다.
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  hf:
    claimName: kubeai-hf-cache
    size: 80Gi
  ollama:
    claimName: kubeai-ollama-cache
    size: 80Gi

modelRollouts:
  # The number of replicas to add when rolling out a new model.
  surge: 1

metrics:
  prometheusOperator:
    vLLMPodMonitor:
      # Enable creation of PodMonitor resource that scrapes vLLM metrics endpoint.
      enabled: false
      # Set the apiVersion to azmonitoring.coreos.com/v1 when using Azure Monitor managed service for Prometheus
      apiVersion: monitoring.coreos.com/v1
      labels: {}

resourceProfiles:
  cpu:
    imageName: "cpu"
    requests:
      cpu: 1
      # TODO: Consider making this a ratio that is more common on cloud machines
      # such as 1:4 CPU:Mem. NOTE: This might need to be adjusted for local clusters.
      memory: "2Gi"
      # TODO: Consider adding eph storage requests/limits.
      # Perhaps this is just needed for GKE Autopilot which defaults
      # to 1Gi for CPU-only.
      # ephemeral-storage: "2Gi"
  nvidia-gpu-t4:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
  nvidia-gpu-l4:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
      cpu: "6"
      memory: "24Gi"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-l40s:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
      cpu: "6"
      memory: "24Gi"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-h100:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-gh200:
    imageName: "gh200"
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-a100-80gb:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-a100-40gb:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-a16:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  nvidia-gpu-rtx4070-8gb:
    imageName: "nvidia-gpu"
    limits:
      nvidia.com/gpu: "1"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
  amd-gpu-mi300x:
    imageName: "amd-gpu"
    limits:
      amd.com/gpu: "1"
    tolerations:
      - key: "amd.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
## 사용자가 정의 후 추가
  amd-gpu-rx9070xt:
    # MacBook Pro M5(Apple Silicon) 호환용 fallback profile.
    # 기존 models/values.yaml에서 이 프로파일명을 참조하더라도
    # 로컬 Mac에서는 CPU 기반으로 동작하게 맞춘다.
    imageName: "cpu"
    requests:
      cpu: "4"
      memory: "8Gi"
cacheProfiles:
  model-cache-80gb:
    sharedFilesystem:
      storageClassName: "standard"
      size: "80Gi"

modelAutoscaling:
  # Interval that the autoscaler will scrape model server metrics.
  # and calculate the desired number of replicas.
  interval: 10s
  # Time window the autoscaling algorithm will consider when calculating
  # the desired number of replicas.
  # Keep this aligned with per-model scaleDownDelaySeconds so idle models
  # can actually decay to zero shortly after the delay expires.
  timeWindow: 60s
  # The name of the ConfigMap that stores the state of the autoscaler.
  # Defaults to "{fullname}-autoscaler-state".
  stateConfigMapName: ""

messaging:
  errorMaxBackoff: 30s
  streams: []

# Configure the openwebui subchart.
open-webui:
  enabled: true
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "latest"
    pullPolicy: Always
  ollama:
    enabled: false
  pipelines:
    enabled: false
  openaiBaseApiUrl: "http://kubeai/openai/v1"
  service:
    type: LoadBalancer
  extraEnvVars:
  - name: WEBUI_AUTH
    value: "False"
  - name: OPENAI_API_KEYS
    value: "not-used"
  - name: SHOW_ADMIN_DETAILS
    value: "false"
  - name: SAFE_MODE
    value: "true"
  - name: ENABLE_EVALUATION_ARENA_MODELS
    value: "False"
  - name: OFFLINE_MODE
    value: "true"
  - name: RAG_EMBEDDING_MODEL_AUTO_UPDATE
    value: "false"
  - name: WHISPER_MODEL_AUTO_UPDATE
    value: "false"
  # Security Context for the openwebui pod
  # Needed for OpenShift
  containerSecurityContext:
    runAsUser: 0
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

replicaCount: 1

image:
  repository: substratusai/kubeai
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# The imagePullSecrets will be used to pull both the kubeai controller image and the model images.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: "kubeai"

command:
- /app/manager

args: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

modelServiceAccount:
  # Specifies whether a service account should be created to be used by model pods
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

# Additional environment variables to add to the KubeAI container
env: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

service:
  type: ClusterIP  # ClusterIP, NodePort, LoadBalancer
  port: 80
  # kubeai nodeport (Optional): Specify NodePort for kubeai if Nodeport or LoadBalancer service type (leave empty for random assignment)
  nodePort: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  rules:
    - host: kubeai.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 120
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
